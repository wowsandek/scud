version: '3.9'

services:
  firesec-ui:
    build:
      context: ./firesec-api-ui
      dockerfile: Dockerfile
    container_name: firesec-ui
    ports:
      - "${NGINX_PORT:-80}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - firesec-network

networks:
  firesec-network:
    driver: bridge

