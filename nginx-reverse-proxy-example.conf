# Пример конфигурации Nginx для reverse proxy
# Сохраните этот файл как /etc/nginx/sites-available/firesec
# или добавьте в существующий конфиг вашего сайта

# Вариант 1: Через поддомен (рекомендуется)
server {
    listen 80;
    server_name firesec.ваш-домен.com;  # Замените на ваш поддомен
    
    # Для HTTPS (после настройки SSL):
    # listen 443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/firesec.ваш-домен.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/firesec.ваш-домен.com/privkey.pem;
    
    location / {
        proxy_pass http://127.0.0.1:8080;  # Порт из вашего .env файла
        proxy_http_version 1.1;
        
        # WebSocket support (если понадобится)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Стандартные заголовки
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        proxy_cache_bypass $http_upgrade;
    }
    
    # Health check endpoint
    location /health {
        proxy_pass http://127.0.0.1:8080/health;
        access_log off;
    }
}

